# Two servers with identical resources; the compare script scales one of them to 1 at a time.
# Pinned to one node, the load generator runs on the other (see benchmark/run-k8s-compare.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-hydrangea
  labels: {app.kubernetes.io/part-of: hydrangea-bench}
spec:
  replicas: 0
  selector: {matchLabels: {app: bench-hydrangea}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-hydrangea}
    spec:
      # nodeSelector: {kubernetes.io/hostname: <node>}   # pin the compared servers to one node for a fair comparison
      terminationGracePeriodSeconds: 10
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["java", "-Xms512m", "-Xmx512m", "-XX:+UseG1GC", "-cp", "/jars/hydrangea.jar:/jars/bench.jar", "servers.HydrangeaHttpServer", "8080", "2", "0.0.0.0"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 2, periodSeconds: 2}
          volumeMounts: [{name: jars, mountPath: /jars}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-jars}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-netty
  labels: {app.kubernetes.io/part-of: hydrangea-bench}
spec:
  replicas: 0
  selector: {matchLabels: {app: bench-netty}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-netty}
    spec:
      # nodeSelector: {kubernetes.io/hostname: <node>}   # pin the compared servers to one node for a fair comparison
      terminationGracePeriodSeconds: 10
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["java", "-Xms512m", "-Xmx512m", "-XX:+UseG1GC", "-cp", "/jars/bench.jar:/jars/hydrangea.jar:/n1/*:/n2/*:/n3/*:/n4/*", "servers.NettyHttpServer", "8080", "2", "0.0.0.0"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 2, periodSeconds: 2}
          volumeMounts:
            - {name: jars, mountPath: /jars}
            - {name: n1, mountPath: /n1}
            - {name: n2, mountPath: /n2}
            - {name: n3, mountPath: /n3}
            - {name: n4, mountPath: /n4}
      volumes:
        - {name: jars, configMap: {name: hydrangea-jars}}
        - {name: n1, configMap: {name: netty-jars-1}}
        - {name: n2, configMap: {name: netty-jars-2}}
        - {name: n3, configMap: {name: netty-jars-3}}
        - {name: n4, configMap: {name: netty-jars-4}}
---
apiVersion: v1
kind: Service
metadata: {name: bench-hydrangea, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-hydrangea}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: bench-netty, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-netty}, ports: [{port: 8080, targetPort: 8080}]}
