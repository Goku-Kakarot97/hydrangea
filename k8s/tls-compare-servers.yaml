# TLS: Hydrangea vs Undertow (tuned, and tuned with the handler dispatched to the worker pool), https on port 8443 (ALPN h2 / http/1.1), each limited to 0.5 CPU, one running at a time (scale the others to 0).
# Same two routes (GET /plain, POST /echo), 1 I/O thread, heap 256 MB. Undertow's jars come from Maven Central through an init container (ConfigMap hydrangea-ut-urls).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-tls-hydrangea
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-tls-hydrangea}
spec:
  replicas: 0
  selector: {matchLabels: {app: bench-tls-hydrangea}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-tls-hydrangea}
    spec:
      initContainers:
        - name: deps
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "mkdir -p /deps && cd /deps && while read p; do curl -fsSL -O https://repo1.maven.org/maven2/$p || exit 1; done < /urls/urls.txt"]
          volumeMounts: [{name: deps, mountPath: /deps}, {name: urls, mountPath: /urls}]
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "exec java -Xms192m -Xmx256m -Dh2=true -Dtls.keystore=/certs/server.p12 -cp \"/jars/hydrangea.jar:/jars/bench.jar:/deps/*\" servers.HydrangeaHttpServer 8443 1 0.0.0.0"]
          ports: [{containerPort: 8443}]
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "500m", memory: 640Mi}
          readinessProbe: {tcpSocket: {port: 8443}, initialDelaySeconds: 3, periodSeconds: 3}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: deps, mountPath: /deps}, {name: certs, mountPath: /certs}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-ut-jars}
        - name: urls
          configMap: {name: hydrangea-ut-urls}
        - name: deps
          emptyDir: {}
        - name: certs
          configMap: {name: hydrangea-tls2-certs}
---
apiVersion: v1
kind: Service
metadata: {name: bench-tls-hydrangea, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-tls-hydrangea}, ports: [{port: 8443, targetPort: 8443}]}
---
