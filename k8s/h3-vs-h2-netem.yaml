# HTTP/2 vs HTTP/3 with the same Python client under emulated delay and loss. Two Hydrangea servers (0.5 CPU each, 1 I/O thread) and one client pod.
# The pods carry NET_ADMIN only to run `tc qdisc ... netem` on their own eth0 (egress); nothing else in the cluster is touched. ClusterIP services only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-cmp-h2
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-cmp-h2}
spec:
  replicas: 1
  selector: {matchLabels: {app: bench-cmp-h2}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-cmp-h2}
    spec:
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "apt-get update -qq >/dev/null && apt-get install -y -qq iproute2 >/dev/null; exec java -Xms192m -Xmx256m -Dh2=true -Dtls.keystore=/certs/k.p12 -cp /jars/hydrangea.jar:/jars/bench.jar servers.HydrangeaHttpServer 8443 1 0.0.0.0"]
          ports: [{containerPort: 8443}]
          securityContext: {capabilities: {add: [NET_ADMIN]}}
          resources: {requests: {cpu: "500m", memory: 512Mi}, limits: {cpu: "500m", memory: 640Mi}}
          readinessProbe: {tcpSocket: {port: 8443}, initialDelaySeconds: 20, periodSeconds: 3}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: certs, mountPath: /certs}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-cmp-jars}
        - name: certs
          configMap: {name: hydrangea-cmp-certs}
---
apiVersion: v1
kind: Service
metadata: {name: bench-cmp-h2, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-cmp-h2}, ports: [{port: 8443, targetPort: 8443}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-cmp-h3
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-cmp-h3}
spec:
  replicas: 1
  selector: {matchLabels: {app: bench-cmp-h3}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-cmp-h3}
    spec:
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "apt-get update -qq >/dev/null && apt-get install -y -qq iproute2 >/dev/null; exec java -Xms192m -Xmx256m -cp /jars/hydrangea.jar io.hydrangea.examples.Http3Example 4433 /certs/k.p12 changeit srv 0.0.0.0"]
          ports: [{containerPort: 4433, protocol: UDP}]
          securityContext: {capabilities: {add: [NET_ADMIN]}}
          resources: {requests: {cpu: "500m", memory: 512Mi}, limits: {cpu: "500m", memory: 640Mi}}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: certs, mountPath: /certs}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-cmp-jars}
        - name: certs
          configMap: {name: hydrangea-cmp-certs}
---
apiVersion: v1
kind: Service
metadata: {name: bench-cmp-h3, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-cmp-h3}, ports: [{port: 4433, protocol: UDP, targetPort: 4433}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-cmp-client
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-cmp-client}
spec:
  replicas: 1
  selector: {matchLabels: {app: bench-cmp-client}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-cmp-client}
    spec:
      containers:
        - name: client
          image: python:3.12-slim
          command: ["/bin/sh", "-c", "apt-get update -qq >/dev/null && apt-get install -y -qq iproute2 >/dev/null; pip install -q --no-cache-dir aioquic h2 2>&1 | tail -1; touch /tmp/ready; exec sleep 7200"]
          securityContext: {capabilities: {add: [NET_ADMIN]}}
          resources: {requests: {cpu: "1", memory: 512Mi}, limits: {cpu: "2", memory: 1Gi}}
          readinessProbe: {exec: {command: ["test", "-f", "/tmp/ready"]}, initialDelaySeconds: 20, periodSeconds: 5}
          volumeMounts: [{name: load, mountPath: /load}]
      volumes:
        - name: load
          configMap: {name: hydrangea-cmp-load}
