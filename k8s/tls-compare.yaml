# Cleartext vs TLS (ALPN h2) on one Hydrangea pod limited to 0.5 CPU: benchmark/src/h2/SoakServer.java with a second, TLS listener (port 8443)
# and benchmark/src/h2/CapLoad.java as the load. Needs ConfigMaps hydrangea-tls-jars (hydrangea.jar, bench.jar) and hydrangea-tls-certs (server.p12,
# trust.p12: a throw-away self-signed EC P-256 certificate for hydrangea-tls-server.iris.svc.cluster.local, generated with keytool).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrangea-tls-server
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-tls-server}
spec:
  replicas: 1
  selector: {matchLabels: {app: hydrangea-tls-server}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-tls-server}
    spec:
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["java", "-Xms192m", "-Xmx256m", "-Dtls.keystore=/certs/server.p12", "-Dtls.port=8443", "-Dhealth.interval.sec=60",
                    "-cp", "/jars/hydrangea.jar:/jars/bench.jar", "h2.SoakServer", "8080", "1", "0.0.0.0"]
          ports: [{containerPort: 8080}, {containerPort: 8443}]
          resources:
            requests: {cpu: "500m", memory: 384Mi}
            limits: {cpu: "500m", memory: 448Mi}
          readinessProbe: {tcpSocket: {port: 8443}, initialDelaySeconds: 3, periodSeconds: 3}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: certs, mountPath: /certs}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-tls-jars}
        - name: certs
          configMap: {name: hydrangea-tls-certs}
---
apiVersion: v1
kind: Service
metadata: {name: hydrangea-tls-server, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec:
  type: ClusterIP
  selector: {app: hydrangea-tls-server}
  ports: [{name: clear, port: 8080, targetPort: 8080}, {name: tls, port: 8443, targetPort: 8443}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hydrangea-tls-load
  labels: {app.kubernetes.io/part-of: hydrangea-bench}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-tls-load}
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c"]
          args:
            - |
              H=hydrangea-tls-server.iris.svc.cluster.local
              CP=/jars/hydrangea.jar:/jars/bench.jar
              run() { # mode scenario
                if [ "$1" = tls ]; then OPT="-Dtls.truststore=/certs/trust.p12"; P=8443; else OPT=""; P=8080; fi
                echo "## $1 $2"; java -Xmx256m $OPT -cp $CP h2.CapLoad $H $P $2 64 2 5 15 2 2>&1 | grep -E "RESULT|Exception"
              }
              for round in 1 2 3; do
                echo "=== round $round"
                if [ $((round % 2)) = 1 ]; then ORDER="clear tls"; else ORDER="tls clear"; fi
                for sc in grpc-16 grpc-4k h2-plain h2-echo1k; do
                  for mode in $ORDER; do run $mode $sc; done
                done
              done
              echo DONE
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "2", memory: 640Mi}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: certs, mountPath: /certs}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-tls-jars}
        - name: certs
          configMap: {name: hydrangea-tls-certs}
