# Jaeger all-in-one (in-memory storage: for trying things out, not for keeping traces). Receives OTLP on 4317 from the collector, UI on 16686:
#   kubectl -n NS port-forward svc/jaeger 16686:16686   then open http://localhost:16686
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: {app.kubernetes.io/part-of: hydrangea-tracing, app: jaeger}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-tracing, app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: MEMORY_MAX_TRACES, value: "20000"}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /, port: 14269}, initialDelaySeconds: 3, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: {app.kubernetes.io/part-of: hydrangea-tracing}
spec:
  type: ClusterIP
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: 16686}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
