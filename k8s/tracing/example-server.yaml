# TracingExample as a Deployment: the image is built from k8s/tracing/Dockerfile (see k8s/README.md, "Tracing").
# The only tracing configuration a service needs is the OTEL_* environment below (read by OtlpSink.fromEnvironment()); the code reads nothing else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracing-example
  labels: {app.kubernetes.io/part-of: hydrangea-tracing, app: tracing-example}
spec:
  replicas: 2
  selector:
    matchLabels: {app: tracing-example}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-tracing, app: tracing-example}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: hydrangea-tracing-example:local      # docker build -t hydrangea-tracing-example:local -f k8s/tracing/Dockerfile .
          imagePullPolicy: IfNotPresent
          args: ["8080"]
          env:
            - {name: OTEL_SERVICE_NAME, value: order-service}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector:4317}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: "1.0"}    # 1.0 while trying it out; 0.1 or less under real load
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=dev,service.namespace=hydrangea"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 384Mi}
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: tracing-example
  labels: {app.kubernetes.io/part-of: hydrangea-tracing}
spec:
  type: ClusterIP
  selector: {app: tracing-example}
  ports: [{port: 8080, targetPort: 8080}]
