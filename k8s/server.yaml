apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrangea-server
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hydrangea-server}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-server}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["java", "-Xms256m", "-Xmx512m", "-Dhealth.interval.sec=30", "-Dshutdown.grace.sec=20", "-cp", "/jars/hydrangea.jar:/jars/bench.jar",
                    "servers.HydrangeaHttpServer", "8080", "2", "0.0.0.0"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "1", memory: 640Mi}
            limits: {cpu: "2", memory: 768Mi}
          lifecycle:
            preStop:
              exec: {command: ["sleep", "8"]}   # let the Service stop routing new connections here before SIGTERM starts the graceful shutdown
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10, failureThreshold: 6}
          volumeMounts: [{name: jars, mountPath: /jars}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-jars}
---
apiVersion: v1
kind: Service
metadata:
  name: hydrangea-server
  labels: {app.kubernetes.io/part-of: hydrangea-bench}
spec:
  type: ClusterIP
  selector: {app: hydrangea-server}
  ports: [{port: 8080, targetPort: 8080}]
