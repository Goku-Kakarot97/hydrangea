# HTTP/3 capacity: Hydrangea Http3Example limited to 0.5 CPU (1 I/O thread, heap 256 MB), UDP 4433, ClusterIP only. The jar and the throw-away certificate
# come from ConfigMaps hydrangea-h3-jars / hydrangea-h3-certs; the load Job (h3-load.yaml.tmpl) is a python:3.12 pod running aioquic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-h3
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-h3}
spec:
  replicas: 0
  selector: {matchLabels: {app: bench-h3}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-h3}
    spec:
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "exec java -Xms192m -Xmx256m -cp /jars/hydrangea.jar io.hydrangea.examples.Http3Example 4433 /certs/k.p12 changeit srv 0.0.0.0"]
          ports: [{containerPort: 4433, protocol: UDP}]
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "500m", memory: 640Mi}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: certs, mountPath: /certs}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-h3-jars}
        - name: certs
          configMap: {name: hydrangea-h3-certs}
---
apiVersion: v1
kind: Service
metadata: {name: bench-h3, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-h3}, ports: [{port: 4433, protocol: UDP, targetPort: 4433}]}
