# Two gRPC echo servers, each limited to 0.5 CPU, one replica running at a time (scale the other to 0):
# bench-grpc-hydrangea (Hydrangea) and bench-grpc-java (grpc-java, netty-shaded). Both are benchmark/src/grpc/GrpcBench.java with 1 I/O thread.
# grpc-java's jars come from Maven Central through an init container (too large for a ConfigMap); the jar list is in the ConfigMap hydrangea-gj-urls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-grpc-hydrangea
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-grpc-hydrangea}
spec:
  replicas: 0
  selector: {matchLabels: {app: bench-grpc-hydrangea}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-grpc-hydrangea}
    spec:
      initContainers:
        - name: deps
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "mkdir -p /deps && cd /deps && while read p; do curl -fsSL -O https://repo1.maven.org/maven2/$p || exit 1; done < /urls/urls.txt"]
          volumeMounts: [{name: deps, mountPath: /deps}, {name: urls, mountPath: /urls}]
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "exec java -Xms192m -Xmx256m -Dbind=0.0.0.0 -cp \"/jars/hydrangea.jar:/jars/gbench.jar:/deps/*\" GrpcBench server hydrangea 8080 1"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "500m", memory: 640Mi}
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 3, periodSeconds: 3}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: deps, mountPath: /deps}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-gj-jars}
        - name: urls
          configMap: {name: hydrangea-gj-urls}
        - name: deps
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-grpc-java
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-grpc-java}
spec:
  replicas: 0
  selector: {matchLabels: {app: bench-grpc-java}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: bench-grpc-java}
    spec:
      initContainers:
        - name: deps
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "mkdir -p /deps && cd /deps && while read p; do curl -fsSL -O https://repo1.maven.org/maven2/$p || exit 1; done < /urls/urls.txt"]
          volumeMounts: [{name: deps, mountPath: /deps}, {name: urls, mountPath: /urls}]
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c", "exec java -Xms192m -Xmx256m -Dbind=0.0.0.0 -cp \"/jars/hydrangea.jar:/jars/gbench.jar:/deps/*\" GrpcBench server java 8080 1"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "500m", memory: 640Mi}
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 3, periodSeconds: 3}
          volumeMounts: [{name: jars, mountPath: /jars}, {name: deps, mountPath: /deps}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-gj-jars}
        - name: urls
          configMap: {name: hydrangea-gj-urls}
        - name: deps
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: bench-grpc-hydrangea, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-grpc-hydrangea}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: bench-grpc-java, labels: {app.kubernetes.io/part-of: hydrangea-bench}}
spec: {type: ClusterIP, selector: {app: bench-grpc-java}, ports: [{port: 8080, targetPort: 8080}]}
