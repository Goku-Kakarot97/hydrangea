# gRPC + HTTP/2 soak target (benchmark/src/h2/SoakServer.java). Needs the ConfigMap hydrangea-soak-jars (see k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrangea-soak-server
  labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-soak-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hydrangea-soak-server}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-soak-server}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: server
          image: eclipse-temurin:21-jre
          command: ["java", "-Xms256m", "-Xmx512m", "-XX:+UseG1GC", "-Dhealth.interval.sec=30", "-cp", "/jars/hydrangea.jar:/jars/bench.jar",
                    "h2.SoakServer", "8080", "2", "0.0.0.0"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "1", memory: 640Mi}
            limits: {cpu: "2", memory: 768Mi}
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          volumeMounts: [{name: jars, mountPath: /jars}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-soak-jars}
---
apiVersion: v1
kind: Service
metadata:
  name: hydrangea-soak-server
  labels: {app.kubernetes.io/part-of: hydrangea-bench}
spec:
  type: ClusterIP
  selector: {app: hydrangea-soak-server}
  ports: [{port: 8080, targetPort: 8080}]
