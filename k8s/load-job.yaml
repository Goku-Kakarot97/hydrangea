apiVersion: batch/v1
kind: Job
metadata:
  name: hydrangea-load
  labels: {app.kubernetes.io/part-of: hydrangea-bench}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: hydrangea-bench, app: hydrangea-load}
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: eclipse-temurin:21-jre
          command: ["/bin/sh", "-c"]
          args:
            - |
              H=hydrangea-server.iris.svc.cluster.local
              L() { echo "## $*"; java -Xmx384m -cp /jars/hydrangea.jar:/jars/bench.jar bench.HttpLoad "$@" 2>&1 | grep -E "RESULT|ERROR-KIND"; }
              # mode port conns threads warmup duration opts
              L http 8080 64   2 3 10 host=$H path=/plain
              L http 8080 1000 2 3 10 host=$H path=/plain
              L http 8080 64   2 3 10 host=$H path=/json
              L http 8080 64   2 3 10 host=$H "path=/users/%d?q=hello"
              L http 8080 64   2 3 10 host=$H method=POST path=/echo body=1024
              L http 8080 8    2 3 10 host=$H path=/download/1048576 verify=false
              L ws   8080 64   2 3 10 host=$H size=64
              L ws   8080 1000 2 3 10 host=$H size=64
              L sse  8080 1000 2 3 10 host=$H path=/sse
              echo DONE
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "2", memory: 640Mi}
          volumeMounts: [{name: jars, mountPath: /jars}]
      volumes:
        - name: jars
          configMap: {name: hydrangea-jars}
